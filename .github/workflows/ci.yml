name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check isoline tests
      - run: bandit -q -r isoline -ll   # fail on medium or high severity findings
      - run: mypy
      - run: pytest --cov=isoline --cov-report=term-missing

  install-smoke:
    name: Clean install from built wheel
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Install wheel in a fresh venv (no extras) and start the CLI
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/clean"
          if [ -d "$RUNNER_TEMP/clean"/Scripts ]; then BIN="$RUNNER_TEMP/clean"/Scripts; else BIN="$RUNNER_TEMP/clean"/bin; fi
          $BIN/python -m pip install dist/*.whl
          $BIN/isoline --version
          $BIN/isoline --help
          $BIN/python -c "import isoline, isoline.cli.app"
      - name: Wheel with the optional MCP extra
        shell: bash
        run: |
          if [ -d "$RUNNER_TEMP/clean"/Scripts ]; then BIN="$RUNNER_TEMP/clean"/Scripts; else BIN="$RUNNER_TEMP/clean"/bin; fi
          $BIN/python -m pip install "$(ls dist/*.whl)[mcp]"
          $BIN/python -c "import isoline.mcp.server"
