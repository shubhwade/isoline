name: Deploy docs
on:
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml", "README.md", "CHANGELOG.md"]
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install mkdocs-material "mkdocstrings[python]"
      - run: mkdocs build --strict   # fail on broken links before deploying
        env:
          NO_MKDOCS_2_WARNING: "1"
      - run: mkdocs gh-deploy --force   # updates only the gh-pages branch, never main
