name: Publish to PyPI
# Triggered by pushing a tag such as v0.3.0. The `pypi` environment can be set
# to "Required reviewers" in the repo settings so a human approves every release.
# Emergency stop: set the repository variable RELEASES_DISABLED=true (Settings ->
# Secrets and variables -> Actions -> Variables). See docs/project/release-process.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read   # jobs that need more ask for it themselves

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ vars.RELEASES_DISABLED != 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Tag must match package version
        run: |
          PKG=$(python -c "import re,pathlib;print(re.search(r'__version__ = \"(.+?)\"', pathlib.Path('isoline/__init__.py').read_text()).group(1))")
          if [ "v$PKG" != "${GITHUB_REF_NAME}" ]; then echo "Tag ${GITHUB_REF_NAME} != package v$PKG"; exit 1; fi
      - name: Version must not already exist on PyPI
        run: |
          PKG="${GITHUB_REF_NAME#v}"
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/isoline/${PKG}/json")
          if [ "$CODE" = "200" ]; then echo "isoline $PKG is already on PyPI; published versions are never overwritten. Bump the version."; exit 1; fi
      - run: python -m pip install -e ".[dev]"
      - run: ruff check isoline tests && mypy && pytest
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write   # lets PyPI Trusted Publishing work when no API token secret is set
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: false
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --generate-notes

  smoke-test:
    needs: publish
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the published release in a clean venv
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python -m venv "$RUNNER_TEMP/smoke"
          for i in 1 2 3 4 5 6; do
            "$RUNNER_TEMP/smoke/bin/pip" install "isoline==${VERSION}" && break
            echo "PyPI index not updated yet; retry $i"; sleep 20
          done
          "$RUNNER_TEMP/smoke/bin/isoline" --version | grep -F "${VERSION}"
          "$RUNNER_TEMP/smoke/bin/isoline" --help > /dev/null
