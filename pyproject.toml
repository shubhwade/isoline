[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "isoline"
dynamic = ["version"]
description = "Financial statements, measured precisely: Piotroski, Altman and Beneish scores, quality metrics, compare, screen and reports"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Shubh Wade", email = "shubhwade@gmail.com"}]
dependencies = [
    "openpyxl>=3.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24",
    "yfinance>=0.2.40",
]
keywords = ["finance", "financial-analysis", "ai", "python", "financial-modeling"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.urls]
Homepage = "https://shubhwade.github.io/isoline"
Documentation = "https://shubhwade.github.io/isoline"
Repository = "https://github.com/shubhwade/isoline"
Changelog = "https://shubhwade.github.io/isoline/changelog/"

[project.scripts]
isoline = "isoline.cli.app:app"

[project.optional-dependencies]
mcp = ["mcp>=1.20,<2"]
tui = ["textual>=1.0,<9"]
dev = [
    "mcp>=1.20,<2",
    "textual>=1.0,<9",
    "mypy",
    "build",
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
    "bandit",
    "twine",
    "mkdocs-material",
    "mkdocstrings[python]",
    "streamlit",
]

[tool.hatch.build.targets.wheel]
packages = ["isoline"]

[tool.hatch.version]
path = "isoline/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["isoline", "tests", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: tests that need the live internet (deselect with -m 'not network')"]
addopts = "-m 'not network'"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
files = ["isoline/core", "isoline/sdk", "isoline/__init__.py"]
