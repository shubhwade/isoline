site_name: isoline
site_description: Financial statement analysis for AI IDEs and coding agents
docs_dir: docs
exclude_docs: |
  internal/
site_url: https://shubhwade.github.io/isoline
repo_url: https://github.com/shubhwade/isoline
repo_name: shubhwade/isoline
extra_css:
  - stylesheets/extra.css

theme:
  custom_dir: docs/overrides
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  name: material
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - search.highlight
    - toc.integrate
    - navigation.indexes
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true

nav:
  - Home: index.md
  - Quick start: quickstart.md
  - Reference:
    - CLI: cli.md
    - Python SDK: sdk.md
    - MCP server: mcp.md
    - Terminal interface: terminal.md
    - Valuation (DCF): valuation.md
    - Reports: reports.md
    - Power BI: powerbi.md
  - Methodology:
    - Formulas and sources: methodology.md
    - Health engine: engines/health.md
  - Project:
    - Architecture: project/architecture.md
    - Data sources: project/data-sources.md
    - Release process: project/release-process.md
    - Brand migration: project/brand-migration.md
    - Roadmap: project/roadmap.md
    - Growth plan: project/growth-roadmap.md
    - Changelog: changelog.md
